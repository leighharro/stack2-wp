name: Build WordPress Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_SLUG: stack2-connector
  PLUGIN_MAIN_FILE: stack2-connector/stack2-connector.php

jobs:
  build:
    name: Validate and Package Plugin
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_name: ${{ steps.version.outputs.zip_name }}
      latest_zip_name: ${{ steps.version.outputs.latest_zip_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          header_version=$(grep -E '^ \* Version:' "$PLUGIN_MAIN_FILE" | head -n1 | sed -E 's/^ \* Version:[[:space:]]*//')
          const_version=$(grep -E "^define\('STACK2_CONNECTOR_VERSION'" "$PLUGIN_MAIN_FILE" | head -n1 | sed -E "s/.*'([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/")

          if [[ -z "$header_version" ]]; then
            echo "Could not find plugin header version in $PLUGIN_MAIN_FILE"
            exit 1
          fi

          if [[ -z "$const_version" ]]; then
            echo "Could not find STACK2_CONNECTOR_VERSION constant in $PLUGIN_MAIN_FILE"
            exit 1
          fi

          if [[ "$header_version" != "$const_version" ]]; then
            echo "Version mismatch: header=$header_version constant=$const_version"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$header_version" ]]; then
              echo "Tag version ($tag_version) does not match plugin version ($header_version)"
              exit 1
            fi
          fi

          echo "version=$header_version" >> "$GITHUB_OUTPUT"
          echo "zip_name=${PLUGIN_SLUG}-${header_version}.zip" >> "$GITHUB_OUTPUT"
          echo "latest_zip_name=${PLUGIN_SLUG}.zip" >> "$GITHUB_OUTPUT"

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find "$PLUGIN_SLUG" -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.log
          cat /tmp/php-lint.log

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p "build/$PLUGIN_SLUG"

          rsync -a --delete \
            --exclude-from="$PLUGIN_SLUG/.distignore" \
            "$PLUGIN_SLUG/" "build/$PLUGIN_SLUG/"

          (
            cd build
            zip -r "${{ steps.version.outputs.zip_name }}" "$PLUGIN_SLUG"
            shasum -a 256 "${{ steps.version.outputs.zip_name }}" > "${{ steps.version.outputs.zip_name }}.sha256"

            # Stable-named copy so installs can target releases/latest/download/<name>.zip
            # without pinning a version, e.g. `wp plugin install <url> --activate`.
            cp "${{ steps.version.outputs.zip_name }}" "${{ steps.version.outputs.latest_zip_name }}"
            shasum -a 256 "${{ steps.version.outputs.latest_zip_name }}" > "${{ steps.version.outputs.latest_zip_name }}.sha256"
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-release-${{ steps.version.outputs.version }}
          path: |
            build/${{ steps.version.outputs.zip_name }}
            build/${{ steps.version.outputs.zip_name }}.sha256
            build/${{ steps.version.outputs.latest_zip_name }}
            build/${{ steps.version.outputs.latest_zip_name }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: wordpress-release-${{ needs.build.outputs.version }}
          path: build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Stack2 Connector v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            build/${{ needs.build.outputs.zip_name }}
            build/${{ needs.build.outputs.zip_name }}.sha256
            build/${{ needs.build.outputs.latest_zip_name }}
            build/${{ needs.build.outputs.latest_zip_name }}.sha256
