services:
  db:
    image: mariadb:11.4
    container_name: stack2_wp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.8-php8.3-apache
    container_name: stack2_wp_app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    entrypoint: ["/entrypoint-wrapper.sh"]
    command: ["apache2-foreground"]
    volumes:
      - ./stack2-connector:/var/www/html/wp-content/plugins/stack2-connector
      - ./docker/apache/allow-override.conf:/etc/apache2/conf-enabled/allow-override.conf:ro
      - ./docker/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
      - ./docker/certs:/usr/local/share/ca-certificates/stack2-dev:ro

volumes:
  db_data:
